<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reseller Ledger</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f1f5f9; color: #0f172a; padding: 16px; min-height: 100vh; }
    .card { background: white; border-radius: 20px; padding: 24px; max-width: 420px; margin: 24px auto; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); }
    .app-container { max-width: 420px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 800; color: #4f46e5; text-align: center; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 20px; }
    .error-box { background: #ffe4e6; color: #be123c; padding: 12px; border-radius: 12px; font-size: 13px; margin-bottom: 16px; font-weight: 500; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 6px; margin-top: 14px; letter-spacing: 0.5px; }
    input, select { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; outline: none; background: #fff; color: #0f172a; }
    input:focus, select:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
    .btn-primary { width: 100%; background: #4f46e5; color: white; font-weight: 700; padding: 14px; border-radius: 12px; border: none; font-size: 15px; margin-top: 16px; cursor: pointer; transition: background 0.2s; }
    .btn-primary:active { background: #4338ca; }
    .btn-dark { width: 100%; background: #0f172a; color: white; font-weight: 700; padding: 14px; border-radius: 12px; border: none; font-size: 15px; margin-top: 12px; cursor: pointer; }
    .text-link { color: #4f46e5; font-weight: 700; background: none; border: none; cursor: pointer; font-size: 14px; }
    .hidden { display: none !important; }
    .balance-card { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); color: white; border-radius: 20px; padding: 22px; margin-bottom: 20px; box-shadow: 0 8px 20px -4px rgba(79,70,229,0.3); }
    .balance-card p { font-size: 11px; opacity: 0.85; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .balance-card h2 { color: white; font-size: 32px; font-weight: 900; text-align: left; margin-top: 4px; }
    .flex-row { display: flex; gap: 10px; }
    .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 16px 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 4px 12px -2px rgba(0,0,0,0.05); }
    .logout-btn { background: #f1f5f9; color: #475569; border: none; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .logout-btn:hover { background: #e2e8f0; }
    .tx-card { padding: 14px 16px; border-radius: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .tx-income { background: #ecfdf5; border-color: #a7f3d0; }
    .tx-expense { background: #fff1f2; border-color: #fecdd3; }
    .amount-income { color: #059669; font-weight: 800; font-size: 15px; }
    .amount-expense { color: #e11d48; font-weight: 800; font-size: 15px; }
    .delete-btn { background: none; border: none; color: #94a3b8; font-size: 16px; font-weight: bold; cursor: pointer; padding: 4px 8px; }
    .delete-btn:hover { color: #e11d48; }
    .section-title { font-weight: 800; color: #334155; margin-bottom: 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged,
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      query, 
      where, 
      onSnapshot, 
      orderBy, 
      serverTimestamp,
      deleteDoc,
      doc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // PASTE YOUR FIREBASE KEYS HERE:
    const firebaseConfig = {
      apiKey: "AIzaSyYOUR_ACTUAL_API_KEY",
      authDomain: "my-store-app.firebaseapp.com",
      projectId: "my-store-app",
      storageBucket: "my-store-app.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    // Navigation UI Helpers
    window.showAuthView = () => {
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('app-screen').classList.add('hidden');
    };

    window.showAppView = (user) => {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('user-display').innerText = user.displayName || user.email;
      loadTransactions(user.uid);
    };

    // Auth State Observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        showAppView(user);
      } else {
        currentUser = null;
        showAuthView();
      }
    });

    // Handle Register
    window.handleRegister = async (e) => {
      e.preventDefault();
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const errorEl = document.getElementById('auth-error');

      try {
        errorEl.classList.add('hidden');
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(userCredential.user, { displayName: username });
      } catch (err) {
        errorEl.innerText = err.message;
        errorEl.classList.remove('hidden');
      }
    };

    // Handle Login
    window.handleLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('auth-error');

      try {
        errorEl.classList.add('hidden');
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        errorEl.innerText = err.message;
        errorEl.classList.remove('hidden');
      }
    };

    // Handle Logout
    window.handleLogout = () => {
      signOut(auth);
    };

    // Add Entry
    window.handleAddEntry = async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const item = document.getElementById('item-name').value;
      const amount = parseFloat(document.getElementById('item-amount').value);
      const type = document.getElementById('item-type').value;

      try {
        await addDoc(collection(db, "transactions"), {
          userId: currentUser.uid,
          item: item,
          amount: amount,
          type: type,
          createdAt: serverTimestamp()
        });
        document.getElementById('entry-form').reset();
      } catch (err) {
        alert("Error saving entry: " + err.message);
      }
    };

    // Delete Entry
    window.deleteEntry = async (id) => {
      try {
        await deleteDoc(doc(db, "transactions", id));
      } catch (err) {
        alert("Error deleting: " + err.message);
      }
    };

    // Realtime Transactions Listener
    function loadTransactions(userId) {
      const q = query(
        collection(db, "transactions"), 
        where("userId", "==", userId),
        orderBy("createdAt", "desc")
      );

      onSnapshot(q, (snapshot) => {
        const listEl = document.getElementById('transaction-list');
        listEl.innerHTML = '';
        let totalIncome = 0;
        let totalExpense = 0;

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const id = docSnap.id;

          if (data.type === 'income') totalIncome += data.amount;
          if (data.type === 'expense') totalExpense += data.amount;

          const card = document.createElement('div');
          card.className = `tx-card ${data.type === 'income' ? 'tx-income' : 'tx-expense'}`;
          card.innerHTML = `
            <div>
              <p style="font-weight: 700; color: #1e293b; font-size: 15px;">${data.item}</p>
              <p style="font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 600;">${data.type}</p>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <span class="${data.type === 'income' ? 'amount-income' : 'amount-expense'}">
                ${data.type === 'income' ? '+' : '-'}${data.amount.toLocaleString()} ETB
              </span>
              <button onclick="deleteEntry('${id}')" class="delete-btn">✕</button>
            </div>
          `;
          listEl.appendChild(card);
        });

        document.getElementById('total-balance').innerText = `${(totalIncome - totalExpense).toLocaleString()} ETB`;
      });
    }

    // Toggle Form Mode
    window.toggleAuthMode = (mode) => {
      if (mode === 'signup') {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('signup-box').classList.remove('hidden');
      } else {
        document.getElementById('signup-box').classList.add('hidden');
        document.getElementById('login-box').classList.remove('hidden');
      }
    };
  </script>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="card" style="margin-top: 40px;">
    <h1>Reseller Ledger</h1>
    <p class="subtitle">Track your inventory and profits effortlessly</p>

    <div id="auth-error" class="error-box hidden"></div>

    <!-- Login Box -->
    <div id="login-box">
      <form onsubmit="handleLogin(event)">
        <div>
          <label>Email</label>
          <input type="email" id="login-email" required>
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="btn-primary">Log In</button>
      </form>
      <p style="text-align: center; font-size: 14px; margin-top: 20px; color: #64748b;">
        Need an account? <button onclick="toggleAuthMode('signup')" class="text-link">Sign Up</button>
      </p>
    </div>

    <!-- Signup Box -->
    <div id="signup-box" class="hidden">
      <form onsubmit="handleRegister(event)">
        <div>
          <label>Username</label>
          <input type="text" id="reg-username" required>
        </div>
        <div>
          <label>Email</label>
          <input type="email" id="reg-email" required>
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="reg-password" required>
        </div>
        <button type="submit" class="btn-primary">Create Account</button>
      </form>
      <p style="text-align: center; font-size: 14px; margin-top: 20px; color: #64748b;">
        Already registered? <button onclick="toggleAuthMode('login')" class="text-link">Log In</button>
      </p>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen" class="app-container hidden">
    <!-- Header -->
    <div class="header">
      <div>
        <p style="font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 600;">Welcome back,</p>
        <h3 id="user-display" style="font-weight: 800; color: #312e81; font-size: 16px;">User</h3>
      </div>
      <button onclick="handleLogout()" class="logout-btn">Logout</button>
    </div>

    <!-- Balance Banner -->
    <div class="balance-card">
      <p>Net Balance</p>
      <h2 id="total-balance">0 ETB</h2>
    </div>

    <!-- Add Entry Form -->
    <div class="card" style="margin: 0 0 24px 0; max-width: none;">
      <h3 class="section-title" style="margin-bottom: 14px;">Record New Entry</h3>
      <form id="entry-form" onsubmit="handleAddEntry(event)">
        <div style="margin-bottom: 12px;">
          <input type="text" id="item-name" placeholder="Item Name (e.g. PS5 Controller)" required>
        </div>
        <div class="flex-row" style="margin-bottom: 12px;">
          <input type="number" id="item-amount" placeholder="Amount (ETB)" required>
          <select id="item-type" style="font-weight: 700; background: #f8fafc;">
            <option value="income">Sale (+)</option>
            <option value="expense">Expense (-)</option>
          </select>
        </div>
        <button type="submit" class="btn-dark">Save Entry</button>
      </form>
    </div>

    <!-- Ledger History -->
    <div>
      <h3 class="section-title">Recent Transactions</h3>
      <div id="transaction-list">
        <!-- Entries will render here dynamically -->
      </div>
    </div>
  </div>

</body>
</html>
