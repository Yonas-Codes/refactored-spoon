<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reseller Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <div class="max-w-md mx-auto w-full p-4 flex-1 flex flex-col justify-center">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-400">Reseller Ledger</h1>
            <p class="text-xs text-slate-400 mt-1">Connected to Firebase Cloud</p>
        </header>

        <!-- Auth View -->
        <div id="auth-container" class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
            <h2 id="auth-title" class="text-lg font-semibold mb-4 text-center">Sign In to Your Ledger</h2>
            
            <div id="error-msg" class="hidden bg-red-950/50 border border-red-800 text-red-300 text-xs p-3 rounded-lg mb-4"></div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Email</label>
                    <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold py-2.5 rounded-xl text-sm transition-colors">Sign In</button>
            </form>

            <div class="mt-4 text-center">
                <button id="toggle-auth" class="text-xs text-emerald-400 hover:underline">Need an account? Sign Up</button>
            </div>
        </div>

        <!-- Ledger Dashboard (Hidden by Default) -->
        <div id="dashboard-container" class="hidden space-y-4">
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                <div>
                    <p class="text-xs text-slate-400">Logged in as:</p>
                    <p id="user-email-display" class="text-sm font-medium text-emerald-400 truncate max-w-[200px]"></p>
                </div>
                <button id="logout-btn" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300">Sign Out</button>
            </div>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-center">
                <p class="text-xs text-slate-400 uppercase tracking-wider">Current Balance</p>
                <h2 class="text-3xl font-bold text-emerald-400 mt-1" id="net-balance">ETB 0.00</h2>
            </div>

            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                <h3 class="text-sm font-semibold mb-3">Add Transaction</h3>
                <form id="transaction-form" class="space-y-3">
                    <div class="flex gap-2">
                        <select id="tx-type" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200">
                            <option value="sale">Sale (+)</option>
                            <option value="expense">Expense (-)</option>
                        </select>
                        <input type="text" id="tx-desc" placeholder="Item / Description" required class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                    </div>
                    <input type="number" id="tx-amount" placeholder="Amount (ETB)" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                    <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold py-2 rounded-xl text-xs">Save Transaction</button>
                </form>
            </div>

            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
                <h3 class="text-sm font-semibold mb-3">Recent Activity</h3>
                <div id="tx-list" class="space-y-2 max-h-48 overflow-y-auto text-xs text-slate-400">
                    <p class="text-center py-4">No transactions yet.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your exact Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyCvUjmf03bDhhJhMDB1_518yRm8uDRZjoQ",
          authDomain: "my-store-app-d6f98.firebaseapp.com",
          projectId: "my-store-app-d6f98",
          storageBucket: "my-store-app-d6f98.firebasestorage.app",
          messagingSenderId: "961594214393",
          appId: "1:961594214393:web:1752c14708f1707c135f28",
          measurementId: "G-KTWL2R9WX4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isSignUp = false;

        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const authForm = document.getElementById('auth-form');
        const authTitle = document.getElementById('auth-title');
        const authBtn = document.getElementById('auth-btn');
        const toggleAuthBtn = document.getElementById('toggle-auth');
        const errorMsg = document.getElementById('error-msg');
        const logoutBtn = document.getElementById('logout-btn');
        const userEmailDisplay = document.getElementById('user-email-display');
        const transactionForm = document.getElementById('transaction-form');
        const txList = document.getElementById('tx-list');
        const netBalance = document.getElementById('net-balance');

        toggleAuthBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            authTitle.textContent = isSignUp ? 'Create New Account' : 'Sign In to Your Ledger';
            authBtn.textContent = isSignUp ? 'Sign Up' : 'Sign In';
            toggleAuthBtn.textContent = isSignUp ? 'Already have an account? Sign In' : 'Need an account? Sign Up';
            errorMsg.classList.add('hidden');
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.classList.remove('hidden');
            }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                userEmailDisplay.textContent = user.email;
                loadTransactions(user.uid);
            } else {
                authContainer.classList.remove('hidden');
                dashboardContainer.classList.add('hidden');
            }
        });

        transactionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const type = document.getElementById('tx-type').value;
            const description = document.getElementById('tx-desc').value;
            const amount = parseFloat(document.getElementById('tx-amount').value);

            try {
                await addDoc(collection(db, "transactions"), {
                    uid: user.uid,
                    type,
                    description,
                    amount,
                    createdAt: new Date()
                });
                transactionForm.reset();
            } catch (err) {
                alert("Error saving transaction: " + err.message);
            }
        });

        function loadTransactions(uid) {
            const q = query(collection(db, "transactions"), where("uid", "==", uid));
            onSnapshot(q, (snapshot) => {
                let total = 0;
                let html = "";
                const docs = snapshot.docs;
                
                if (docs.length === 0) {
                    txList.innerHTML = `<p class="text-center py-4">No transactions yet.</p>`;
                    netBalance.textContent = "ETB 0.00";
                    return;
                }

                docs.forEach((docSnap) => {
                    const tx = docSnap.data();
                    if (tx.type === 'sale') {
                        total += tx.amount;
                        html += `<div class="flex justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800"><span>${tx.description}</span><span class="text-emerald-400 font-semibold">+${tx.amount} ETB</span></div>`;
                    } else {
                        total -= tx.amount;
                        html += `<div class="flex justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800"><span>${tx.description}</span><span class="text-red-400 font-semibold">-${tx.amount} ETB</span></div>`;
                    }
                });

                netBalance.textContent = `ETB ${total.toFixed(2)}`;
                txList.innerHTML = html;
            });
        }
    </script>
</body>
</html>
